[versions]
androidGradlePlugin = "9.2.1"
androidxCore = "1.19.0"
androidxLifecycle = "2.11.0-rc01"
androidxActivity = "1.13.0"
androidxComposeBom = "2026.05.01"
androidxTest = "1.7.0"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestEspresso = "3.7.0"
coroutines = "1.11.0"
junit = "4.13.2"
kotlin = "2.4.0"
koinVersion = "4.2.2"
nav3Core = "1.1.2"
lifecycleViewmodelNav3 = "2.10.0"
navigationCompose = "2.9.8"
uiGraphics = "1.11.2"
cameraCompose = "1.6.1"
cameraXVersion = "1.7.0-alpha01"
media3EffectVersion = "1.0.0-alpha04"
media3Version = "1.5.1"

[libraries]
# androidx-camera
# The following line is optional, as the core library is included indirectly by camera-camera2
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "cameraXVersion" }
androidx-camera-camera2= { module = "androidx.camera:camera-camera2", version.ref="cameraXVersion"}
androidx-camera-compose = { module = "androidx.camera:camera-compose", version.ref = "cameraCompose" }
androidx-camera-media3-effect = { module = "androidx.camera.media3:media3-effect", version.ref="media3EffectVersion"}

# If you want to additionally use the CameraX Lifecycle library
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "cameraXVersion" }

# If you want to additionally use the CameraX VideoCapture library
# androidx-camera-video= { module = "androidx.camera:camera-video", version.ref="cameraXVersion"}

# If you want to additionally use the CameraX View class
# androidx-camera-view= { module = "androidx.camera:camera-view", version.ref="cameraXVersion"}

# If you want to additionally add CameraX ML Kit Vision Integration
# androidx-camera-mlkit= { module = "androidx.camera:camera-mlkit-vision", version.ref="cameraXVersion"}

# If you want to additionally use the CameraX Extensions library
# androidx-camera-extensions= { module = "androidx.camera:camera-extensions", version.ref="cameraXVersion"}

#androidx.camera.viewfinder:viewfinder-compose:1.7.0-alpha01
#androidx.camera.viewfinder:viewfinder-core:1.7.0-alpha01
#androidx.camera.viewfinder:viewfinder-view:1.7.0-alpha01

# androidx-compose-bom
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3Core" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "nav3Core" }
#implementation("androidx.compose.ui:ui:1.11.2")
#androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref="1.11.2")

# androidx-compose-ui
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui"}
androidx-compose-ui-text-googlefonts = { group = "androidx.compose.ui", name = "ui-text-google-fonts", version.ref = "uiGraphics" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "uiGraphics" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4"}
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version = "1.11.2" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling"}
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview"}

# the new androidx lifecycle 2.11.0-rc01
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelNav3" }

androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3"}
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTest" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxTestEspresso" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

junit = { module = "junit:junit", version.ref = "junit" }


koin-android = {module = "io.insert-koin:koin-android", version.ref="koinVersion"}
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref="koinVersion"}

kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
media3-effect = { group = "androidx.media3", name = "media3-effect", version.ref = "media3Version" }


[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
